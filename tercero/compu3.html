<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computación - SynapseNotes</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <style>
        .subject-list {
            list-style: none;
            padding: 0;
            max-width: 600px;
            margin: 2em auto;
        }
        .subject-list li {
            margin-bottom: 1em;
        }
        .subject-list a {
            display: block;
            padding: 1.5em;
            background-color: #fff;
            color: #4a90e2;
            text-decoration: none;
            font-size: 1.2em;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            text-align: center;
        }
        .subject-list a:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="../s3.html">Semestre 3</a></li>
                <li><a href="../buscar.html">Buscar</a></li>
                <li><a href="../miperfil.html">Mi Perfil</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="logo-section">
            <h1>Computación</h1>
            <p>Apuntes y recursos de la especialidad.</p>
        </section>
        <div id="file-list-container"></div>
         <ul class="subject-list">
            <li><a href="../tercero\algoritmia.html">Algoritmia y Programación</a></li>
            <li><a href="../tercero\ensamblado.html">Ensamblado y Soporte de Componentes Electrónicos</a></li>
            <li><a href="../tercero\multimedia.html">Integración de Recursos Multimedia</a></li>
        </ul>
    </main>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const fileListContainer = document.getElementById('file-list-container');
            const pathParts = window.location.pathname.split('/');
            const semestre = pathParts[pathParts.length - 2];
            const materiaHtml = pathParts[pathParts.length - 1];
            const materia = materiaHtml.split('.')[0];

            fetch(`/SynapseNotes1/get_files.php?semestre=${semestre}&materia=${materia}`)
                .then(response => response.json())
                .then(data => {
                    if (data.success && data.files.length > 0) {
                        fileListContainer.innerHTML = '<h2>Archivos disponibles:</h2>';
                        data.files.forEach(file => {
                            const fileEntry = document.createElement('div');
                            fileEntry.classList.add('file-entry');
                            if (file.tipo_mime === 'application/pdf') {
                                fileEntry.innerHTML = `
                                    <h3>${file.nombre_original}</h3>
                                    <div class="pdf-viewer-container">
                                        <iframe src="/SynapseNotes1/${file.ruta_archivo}" title="${file.nombre_original}"></iframe>
                                    </div>
                                    <p><a href="/SynapseNotes1/${file.ruta_archivo}" target="_blank">Ver en nueva pestaña</a></p>
                                `;
                            } else {
                                fileEntry.innerHTML = `
                                    <h3>${file.nombre_original}</h3>
                                    <p><a href="/SynapseNotes1/${file.ruta_archivo}" target="_blank" download>Descargar</a></p>
                                `;
                            }
                            fileListContainer.appendChild(fileEntry);
                        });
                    } else {
                        fileListContainer.innerHTML = '<p>No hay archivos disponibles para esta materia.</p>';
                    }
                })
                .catch(error => {
                    console.error('Error al obtener los archivos:', error);
                    fileListContainer.innerHTML = '<p>Error al cargar los archivos.</p>';
                });
        });
    </script>
</body>
</html>
