<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SynapseNotes</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <header>
      <section class="Inicio"></section>  
        <nav>
            <ul>
                <li class="left"><button id="toggleUploadForm" class="boton">Subida de Archivos</button></li>
                <li><a href="buscar.html">Buscar</a></li>
                <li><a href="miperfil.html">Mi Perfil</a></li>
                <li><a href="iniciarsesion.html">Iniciar Sesión</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="logo-section">
            <img src="img/logoo.jpg" alt="SynapseNotes Logo" class="logo">
            <h1>SynapseNotes</h1>
            <p>La inteligencia colectiva de tus estudios.</p>
        </section>

        

        <section class="semestres-section">
            <div class="card-container">
                <div class="card">
                    <a href="s1.html">
                        <h2>Semestre 1</h2>
                    </a>
                </div>
                <div class="card">
                    <a href="s2.html">
                        <h2>Semestre 2</h2>
                    </a>
                </div>
                <div class="card">
                    <a href="s3.html">
                        <h2>Semestre 3</h2>
                    </a>
                </div>
                <div class="card">
                    <a href="s4.html">
                        <h2>Semestre 4</h2>
                    </a>
                </div>
                <div class="card">
                    <a href="s5.html">
                        <h2>Semestre 5</h2>
                    </a>
                </div>
                <div class="card">
                    <a href="s6.html">
                        <h2>Semestre 6</h2>
                    </a>
                </div>
            </div>
        </section>
    </main>

    <script src="JS/script.js"></script>

    <div id="uploadModal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <section class="upload-form-section">
                <h2>Subir Apuntes</h2>
                <form id="uploadForm">
                    <div class="form-group">
                        <label for="semestre">Semestre:</label>
                        <select id="semestre" name="semestre">
                            <option value="">Selecciona un semestre</option>
                            <option value="primero">1</option>
                            <option value="segundo">2</option>
                            <option value="tercero">3</option>
                            <option value="cuarto">4</option>
                            <option value="quinto">5</option>
                            <option value="sexto">6</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="materia">Materia:</label>
                        <select id="materia" name="materia" disabled>
                            <option value="">Selecciona una materia</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="fileUpload">Selecciona un archivo:</label>
                        <input type="file" id="fileUpload" name="fileUpload" accept=".pdf,.docx,.jpg,.png">
                    </div>
                    <button type="submit">Subir Archivo</button>
                    <div id="filePreview" style="margin-top: 1em; text-align: center;"></div>
                </form>
            </section>
        </div>
    </div>
</body>
</html>
